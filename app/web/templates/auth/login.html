{% extends "base.html" %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="max-w-lg mx-auto mt-6 bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-3xl font-semibold text-slate-900">Iniciar sesión</h1>
  <p class="text-slate-500 mt-2">Entra para ver tu saldo y apostar en tus eventos favoritos.</p>

  {% if error %}
  <p class="mt-6 bg-rose-100 text-rose-800 px-4 py-3 rounded-lg">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="mt-8 space-y-5">
    <div>
      <label for="email" class="text-sm font-medium text-slate-700">Email</label>
      <input id="email" name="email" type="email" required autofocus value="{{ email }}"
             class="mt-1 w-full border border-slate-300 rounded-lg px-4 py-3 text-base focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <div>
      <label for="password" class="text-sm font-medium text-slate-700">Contraseña</label>
      <input id="password" name="password" type="password" required
             class="mt-1 w-full border border-slate-300 rounded-lg px-4 py-3 text-base focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-lg font-semibold px-6 py-3.5 rounded-lg shadow-md hover:shadow-lg transition">
      Iniciar sesión
    </button>
  </form>

  <p class="mt-6 text-slate-500">¿No tienes cuenta? <a href="/registro" class="text-emerald-700 font-medium hover:underline">Regístrate</a></p>
</div>
{% endblock %}
