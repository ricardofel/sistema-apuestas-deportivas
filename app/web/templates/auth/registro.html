{% extends "base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-2xl font-semibold text-slate-900">Crear cuenta</h1>

  {% if error %}
  <p class="mt-4 bg-rose-100 text-rose-800 text-sm px-3 py-2 rounded-lg">{{ error }}</p>
  {% endif %}

  <form method="post" action="/registro" class="mt-6 space-y-4">
    <div>
      <label for="email" class="text-sm text-slate-500">Email</label>
      <input id="email" name="email" type="email" required value="{{ email }}"
             class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <div>
      <label for="nombre_usuario" class="text-sm text-slate-500">Nombre de usuario</label>
      <input id="nombre_usuario" name="nombre_usuario" type="text" required minlength="3" maxlength="50" value="{{ nombre_usuario }}"
             class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <div>
      <label for="password" class="text-sm text-slate-500">Contraseña (mínimo 8 caracteres)</label>
      <input id="password" name="password" type="password" required minlength="8"
             class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition">Registrarme</button>
  </form>

  <p class="mt-4 text-sm text-slate-500">¿Ya tienes cuenta? <a href="/login" class="text-emerald-700 hover:underline">Inicia sesión</a></p>
</div>
{% endblock %}
