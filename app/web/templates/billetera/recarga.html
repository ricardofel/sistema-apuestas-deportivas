{% extends "base.html" %}
{% from "admin/_comun.html" import avisos %}

{% block titulo %}Recargar saldo{% endblock %}

{% block contenido %}
<a href="/admin" class="text-sm text-slate-500 hover:text-slate-900 transition">&larr; Administración</a>
<h1 class="mt-2 text-3xl">Recargar saldo</h1>
<p class="mt-1 text-sm text-slate-600">Acredita créditos virtuales a un usuario.</p>

{{ avisos(mensaje, error) }}

<section class="mt-6 max-w-xl" aria-labelledby="titulo-recarga">
  <div class="banda"><h2 id="titulo-recarga">Nueva recarga</h2></div>
  <div class="panel">
    <form method="post" action="/admin/billetera/recargar" class="space-y-4">
      <div class="campo">
        <label for="usuario_id">Usuario</label>
        <select id="usuario_id" name="usuario_id" required class="entrada">
          {% for u in usuarios %}
          <option value="{{ u.id }}">{{ u.nombre_usuario }} ({{ u.email }}) - saldo {{ u.saldo }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="monto">Monto</label>
        <input id="monto" name="monto" type="number" step="0.01" min="0.01" required class="entrada num">
      </div>
      <div class="campo">
        <label for="descripcion">Descripción (opcional)</label>
        <input id="descripcion" name="descripcion" type="text" maxlength="255" class="entrada">
      </div>
      <button type="submit" class="btn">Recargar</button>
    </form>
  </div>
</section>
{% endblock %}
