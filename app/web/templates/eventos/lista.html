{% extends "base.html" %}

{% block titulo %}Eventos{% endblock %}

{% block contenido %}
<h1 class="text-2xl font-semibold text-slate-900">Eventos disponibles</h1>
<p class="text-sm text-slate-500 mt-1">Elige un resultado para sumarlo a tu boleto.</p>

<div class="mt-6{% if usuario %} grid gap-6 lg:grid-cols-3{% endif %}">
  <div id="contenido-eventos" class="lg:col-span-2">
    {% include "eventos/_lista.html" %}
  </div>
  {% if usuario %}
  <aside class="lg:col-span-1">
    <div id="panel-boleto" hx-get="/web/boleto/panel" hx-trigger="load"></div>
  </aside>
  {% endif %}
</div>
{% endblock %}
