{# Fragmento de éxito tras confirmar la apuesta. Contexto: boleto (BoletoOut), saldo. #}
<div class="banda">
  <h2>Boleto confirmado</h2>
</div>
<div class="panel">
  <div class="aviso aviso--ok">
    <p class="font-bold">¡Apuesta registrada!</p>
    <p class="text-sm mt-1">Apostaste <strong class="num">{{ boleto.monto }}</strong> a cuota <strong class="num">{{ boleto.cuota_total }}</strong>. Si aciertas, ganas <strong class="num">{{ boleto.ganancia_potencial }}</strong>.</p>
  </div>
  <p class="mt-3 text-sm text-slate-600">Saldo disponible: <strong class="num text-slate-900">{{ saldo }}</strong> créditos</p>
  <div class="mt-4 flex gap-2">
    <a href="/boleto/{{ boleto.id }}" class="btn flex-1">Ver boleto</a>
    <button type="button" hx-get="/web/boleto/panel" hx-target="#panel-boleto" hx-swap="innerHTML"
            class="btn btn--sec flex-1">Nuevo boleto</button>
  </div>
</div>
