{# Fragmento de éxito tras confirmar la apuesta. Contexto: boleto (BoletoOut), saldo. #}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3">
    <p class="font-semibold text-emerald-800">¡Apuesta registrada!</p>
    <p class="text-sm text-emerald-800 mt-1">Apostaste {{ boleto.monto }} a cuota {{ boleto.cuota_total }}. Si aciertas, ganas {{ boleto.ganancia_potencial }}.</p>
  </div>
  <p class="mt-3 text-sm text-slate-500">Saldo disponible: <strong class="text-slate-900">{{ saldo }}</strong> créditos</p>
  <div class="mt-4 flex gap-2">
    <a href="/boleto/{{ boleto.id }}" class="flex-1 text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition">Ver boleto</a>
    <button type="button" hx-get="/web/boleto/panel" hx-target="#panel-boleto" hx-swap="innerHTML"
            class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg transition">Nuevo boleto</button>
  </div>
</div>
